services:
  postgres:
    image: postgres:16-alpine
    container_name: pairly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pairly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pairly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: pairly_postgres_data
